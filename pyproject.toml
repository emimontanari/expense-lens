[project]
name = "expense-lens"
version = "0.1.0"
description = "Extracción y revisión humana de comprobantes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "groq>=0.37,<1",
    "pillow>=12,<13",
    "pydantic>=2.10,<3.0",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "uvicorn>=0.34,<1.0",
    "zxing-cpp>=2.3,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1.0",
    "segno>=1.6,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
